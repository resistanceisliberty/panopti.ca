name: Update Canada ALPR + CCTV data

# Refreshes public/cameras-ca.json (ALPRs + government CCTV) from OpenStreetMap and commits
# any changes back to the repo. Runs nightly and on demand.

on:
  schedule:
    # Multiple attempts/day because GitHub's scheduled cron is best-effort and
    # routinely delays or silently drops runs. The build is idempotent (it only
    # commits when the data actually changes), so extra runs are harmless and a
    # dropped slot self-heals at the next one. Off-the-hour to dodge the Overpass
    # load spike. A Cloudflare Cron Trigger (see cron-trigger/) dispatches this
    # workflow too, as a more reliable belt-and-suspenders.
    - cron: '10 7 * * *'    # ~02:10 ET
    - cron: '42 13 * * *'   # ~09:42 ET
    - cron: '27 19 * * *'   # ~15:27 ET
  workflow_dispatch: {}

# Allow the job to push the regenerated data file back to the default branch.
permissions:
  contents: write

concurrency:
  group: update-cameras-ca
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the build can read how long cameras-ca.json has gone
          # without a refresh (the stale-data alert in build-cameras-ca.mjs).
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenerate cameras-ca.json
        run: node scripts/build-cameras-ca.mjs

      - name: Commit if changed
        run: |
          git config user.name "deflock-ca-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/cameras-ca.json
          if git diff --staged --quiet; then
            echo "No changes to Canada camera data."
          else
            git commit -m "chore(data): refresh Canada camera data ($(date -u +%Y-%m-%d))"
            git push
          fi
